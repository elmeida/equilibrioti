name: Rollback - VPS Homologacao

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Release especifico para ativar. Se vazio, volta para o release anterior.
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: equilibrio-bi-homologacao
  cancel-in-progress: false

jobs:
  rollback:
    name: Rollback em VPS de homologacao
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: homologation

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar secrets obrigatorios
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_APP_PATH: ${{ secrets.VPS_APP_PATH }}
        run: |
          set -euo pipefail
          missing=0
          for name in VPS_HOST VPS_USER VPS_SSH_KEY VPS_APP_PATH; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Secret obrigatorio ausente: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Configurar SSH
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/equilibrio_bi_deploy_key"
          chmod 600 "$HOME/.ssh/equilibrio_bi_deploy_key"
          : "${VPS_PORT:=22}"
          if [ -n "${VPS_SSH_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          else
            ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" >> "$HOME/.ssh/known_hosts"
          fi
          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Executar rollback
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_APP_PATH: ${{ secrets.VPS_APP_PATH }}
          VPS_SERVICE_NAME: ${{ secrets.VPS_SERVICE_NAME }}
          VPS_RESTART_COMMAND: ${{ secrets.VPS_RESTART_COMMAND }}
          APP_HEALTHCHECK_URL: ${{ secrets.APP_HEALTHCHECK_URL }}
          SSH_KEY_PATH: ~/.ssh/equilibrio_bi_deploy_key
          ROLLBACK_RELEASE_ID: ${{ inputs.release_id }}
        run: bash scripts/rollback-vps.sh
