name: CD - VPS Homologacao

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: equilibrio-bi-homologacao
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy em VPS de homologacao
    # Repository variables, deliberately unset until the activation checklist is approved.
    if: >-
      vars.HML_CD_ENABLED == 'true' &&
      github.repository == 'elmeida/equilibrioti' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
      (vars.HML_AUTO_DEPLOY_ENABLED == 'true' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: homologation
      url: https://equilibrio-bi-homologacao.atenza.digital

    steps:
      - name: Checkout do controle de publicacao
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validar origem do deploy
        id: context
        env:
          HML_CD_ENABLED: ${{ vars.HML_CD_ENABLED }}
          HML_AUTO_DEPLOY_ENABLED: ${{ vars.HML_AUTO_DEPLOY_ENABLED }}
        run: node scripts/check-deploy-context.mjs

      - name: Checkout do commit validado
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.context.outputs.checkout_ref }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Validar build antes do deploy
        run: npm run ci:check

      - name: Recusar commit superado e definir release
        id: release
        shell: bash
        run: |
          set -euo pipefail
          latest="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$(git rev-parse HEAD)" = "$latest"
          echo "release_id=$(git rev-parse --short=12 HEAD)-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Configurar SSH verificado
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
          VPS_APP_PATH: ${{ secrets.VPS_APP_PATH }}
        run: bash scripts/setup-deploy-ssh.sh

      - name: Deploy sem migrations
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_APP_PATH: ${{ secrets.VPS_APP_PATH }}
          VPS_SERVICE_NAME: equilibrioti
          VPS_NODE_BIN: /opt/atenza/equilibrio-bi/node-v22.23.2-linux-x64/bin
          APP_HEALTHCHECK_URL: https://equilibrio-bi-homologacao.atenza.digital/api/health
          RUN_DB_MIGRATIONS: 'false'
          KEEP_RELEASES: '0'
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
        run: bash scripts/deploy-vps.sh

      - name: Remover chave temporaria do runner
        if: always()
        run: rm -f "$HOME/.ssh/equilibrio_bi_deploy_key"
